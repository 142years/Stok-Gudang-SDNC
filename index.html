<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stok Gudang SDNC</title>
    
    <!-- Memanggil file CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <h1>Dashboard Stok Gudang SDNC</h1>
    </header>

    <main class="container">
        <!-- Area Persiapan Drag & Drop CSV -->
        <section id="upload-section" class="card no-print">
            <h2>Perbarui Data (Upload CSV)</h2>
            <div id="drop-zone" class="drop-zone">
                <p>Tarik dan lepas file CSV SAP di sini</p>
            </div>
        </section>

        <!-- Area Tabel Data -->
        <section id="data-section" class="card no-print">
            <h2>Daftar Stok Saat Ini</h2>
            <table id="tabel-stok">
                <thead>
                    <tr>
                        <th>Kode Barang</th>
                        <th>Deskripsi</th>
                        <th>Stok</th>
                        <th>Gudang</th>
                    </tr>
                </thead>
                <tbody id="data-stok-body">
                    <!-- Baris data akan diisi secara otomatis oleh JavaScript -->
                </tbody>
            </table>
        </section>

        <!-- Area Cetak Nota (Disembunyikan saat normal, ditampilkan saat cetak) -->
        <section id="nota-section" class="card no-print">
            <h2>Buat Nota</h2>
            <button id="btn-nota-pelanggan" class="btn">Cetak Nota Pelanggan</button>
            <button id="btn-nota-staf" class="btn">Cetak Nota Staf</button>
        </section>
        
        <!-- Wadah yang hanya muncul di kertas saat di-print -->
        <div id="print-area" class="print-only">
            <!-- Template nota akan di-generate oleh JS ke dalam div ini -->
        </div>
    </main>

    <!-- Memanggil file JavaScript -->
    <script src="script.js"></script>
</body>
</html>
